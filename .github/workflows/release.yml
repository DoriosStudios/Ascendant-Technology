name: Discord Beta Release Notifier

on:
  workflow_call:
    inputs:
      release_tag:
        description: Published tag; blank reads the configured active release notes
        required: false
        type: string
        default: ""
    secrets:
      DISCORD_BETA_WEBHOOK:
        required: false
  release:
    types: [published]

permissions:
  contents: read
  statuses: write

jobs:
  notify:
    if: ${{ github.event_name != 'release' || github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: discord-beta-${{ github.event.release.tag_name || inputs.release_tag || github.sha }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Announce published prerelease in Discord beta channel
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_BETA_WEBHOOK: ${{ secrets.DISCORD_BETA_WEBHOOK }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node tools/notify-beta-release.mjs
